<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Bulk Renamer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Lexend:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0e27;
            --bg-card: #151932;
            --accent-primary: #00d9ff;
            --accent-secondary: #ff006e;
            --text-primary: #e0e6ed;
            --text-secondary: #8892a6;
            --success: #00ff88;
            --warning: #ffaa00;
            --error: #ff3366;
        }

        body {
            font-family: 'Lexend', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 217, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 0, 110, 0.15) 0%, transparent 50%);
            animation: rotate 30s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.6s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 300;
        }

        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(0, 217, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.6s ease-out;
            animation-fill-mode: both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.2s; }

        .upload-zone {
            border: 2px dashed var(--accent-primary);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .upload-zone::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(0, 217, 255, 0.1);
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }

        .upload-zone:hover::before {
            width: 400px;
            height: 400px;
        }

        .upload-zone:hover {
            border-color: var(--accent-secondary);
            background: rgba(0, 217, 255, 0.02);
            transform: translateY(-2px);
        }

        .upload-zone.dragover {
            border-color: var(--success);
            background: rgba(0, 255, 136, 0.05);
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            position: relative;
            z-index: 1;
        }

        .upload-text {
            font-size: 1.1rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 1;
        }

        .upload-subtext {
            font-size: 0.9rem;
            color: var(--text-secondary);
            position: relative;
            z-index: 1;
        }

        input[type="file"] {
            display: none;
        }

        .settings-grid {
            display: grid;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="number"],
        input[type="text"],
        select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-dark);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus,
        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(0, 217, 255, 0.1);
        }

        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 1rem;
            font-family: 'Lexend', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn span {
            position: relative;
            z-index: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 217, 255, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: var(--success);
            color: var(--bg-dark);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 255, 136, 0.3);
        }

        .btn-tertiary {
            background: var(--warning);
            color: var(--bg-dark);
        }

        .btn-tertiary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 170, 0, 0.3);
        }

        .file-list {
            margin-top: 1.5rem;
        }

        .file-item {
            background: var(--bg-dark);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 0.75rem;
            border: 1px solid rgba(0, 217, 255, 0.1);
            transition: all 0.3s ease;
        }

        .file-item:hover {
            border-color: var(--accent-primary);
            transform: translateX(4px);
        }

        .file-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .file-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: var(--text-primary);
            flex: 1;
            min-width: 200px;
        }

        .file-status {
            font-size: 0.85rem;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-weight: 600;
        }

        .file-status.success {
            background: rgba(0, 255, 136, 0.2);
            color: var(--success);
        }

        .file-status.error {
            background: rgba(255, 51, 102, 0.2);
            color: var(--error);
        }

        .file-status.processing {
            background: rgba(0, 217, 255, 0.2);
            color: var(--accent-primary);
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .example-box {
            background: var(--bg-dark);
            padding: 1.5rem;
            border-radius: 8px;
            border-left: 4px solid var(--accent-primary);
            margin-top: 1rem;
        }

        .example-title {
            font-weight: 600;
            color: var(--accent-primary);
            margin-bottom: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .info-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
        }

        @media (max-width: 640px) {
            .btn-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>PDF Bulk Renamer</h1>
            <div class="subtitle">Extract case numbers and rename PDFs automatically</div>
        </header>

        <div class="card">
            <h3 style="margin-bottom: 1rem; color: var(--accent-primary);">Settings</h3>
            <div class="settings-grid">
                <div>
                    <label for="searchLabel">Search Label</label>
                    <input type="text" id="searchLabel" value="Ügyszám:" placeholder="e.g., Case Number:">
                </div>
                <div>
                    <label for="regexPattern">Regex Pattern</label>
                    <input type="text" id="regexPattern" value="[A-Z]\d{11}" placeholder="e.g., [A-Z]\d{11}">
                </div>
                <div>
                    <label for="separatorChar">Separator Character</label>
                    <input type="text" id="separatorChar" value=" " placeholder="e.g., space, _, -">
                </div>
                <div>
                    <label for="keepExtension">Keep Extension</label>
                    <select id="keepExtension">
                        <option value="yes">Yes (.pdf)</option>
                        <option value="no">No</option>
                    </select>
                </div>
            </div>

            <div class="example-box">
                <div class="example-title">Example:</div>
                <div style="font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 0.5rem;">
                    NCBB062B_D9X_0_.pdf
                </div>
                <div style="font-size: 1.2rem; margin: 0.5rem 0;">↓</div>
                <div style="font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; color: var(--accent-primary);">
                    NCBB062B_D9X_0_<span style="color: var(--accent-secondary);"> E22753062 </span>.pdf
                </div>
                <div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.5rem;">
                    Original name (unchanged) + space + <span style="color: var(--accent-secondary);">extracted case number</span> + space + extension
                </div>
            </div>
        </div>

        <div class="card">
            <div class="upload-zone" id="uploadZone">
                <div class="upload-icon">📄</div>
                <div class="upload-text">Click to upload or drag & drop PDF files</div>
                <div class="upload-subtext">Support for multiple files</div>
            </div>
            <input type="file" id="fileInput" accept=".pdf" multiple>
            
            <div id="fileList" class="file-list"></div>
            
            <button class="btn btn-primary" id="processBtn" disabled>
                <span>Process PDFs</span>
            </button>
            
            <div class="btn-group" id="downloadBtnGroup" style="display: none;">
                <button class="btn btn-secondary" id="downloadZipBtn">
                    <span>Download ZIP</span>
                </button>
                <button class="btn btn-tertiary" id="downloadIndividualBtn">
                    <span>Download Individual Files</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Initialize PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // State management
        let uploadedFiles = [];
        let processedFiles = [];

        // DOM elements
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const processBtn = document.getElementById('processBtn');
        const downloadBtnGroup = document.getElementById('downloadBtnGroup');
        const downloadZipBtn = document.getElementById('downloadZipBtn');
        const downloadIndividualBtn = document.getElementById('downloadIndividualBtn');

        // Upload zone interactions
        uploadZone.addEventListener('click', () => fileInput.click());

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        // Handle file uploads
        function handleFiles(files) {
            const pdfFiles = Array.from(files).filter(file => file.type === 'application/pdf');
            
            if (pdfFiles.length === 0) {
                alert('Please upload only PDF files.');
                return;
            }

            uploadedFiles = [...uploadedFiles, ...pdfFiles];
            displayFileList();
            processBtn.disabled = false;
            downloadBtnGroup.style.display = 'none';
            processedFiles = [];
        }

        // Display uploaded files
        function displayFileList() {
            fileList.innerHTML = '';
            uploadedFiles.forEach((file, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <div class="file-info">
                        <div class="file-name">${file.name}</div>
                        <div class="file-status" id="status-${index}">Ready to process</div>
                    </div>
                `;
                fileList.appendChild(fileItem);
            });
        }

        // Extract text from PDF and find the case number after the label
        async function extractTextFromPDF(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            const page = await pdf.getPage(1);
            
            const textContent = await page.getTextContent();
            
            // Combine all text items into a single string
            let fullText = '';
            textContent.items.forEach(item => {
                fullText += item.str + ' ';
            });
            
            // Get the search label from settings
            const searchLabel = document.getElementById('searchLabel').value;
            
            // Find the position of the label
            const labelIndex = fullText.indexOf(searchLabel);
            if (labelIndex === -1) {
                throw new Error(`Could not find "${searchLabel}" in the document`);
            }
            
            // Extract text after the label (next 50 characters should be enough)
            const textAfterLabel = fullText.substring(labelIndex + searchLabel.length, labelIndex + searchLabel.length + 50);
            
            return textAfterLabel.trim();
        }

        // Process extracted text using regex pattern
        function processExtractedText(text) {
            const pattern = document.getElementById('regexPattern').value;
            
            try {
                const regex = new RegExp(pattern);
                const match = text.match(regex);
                
                if (match) {
                    return match[0];
                } else {
                    throw new Error(`No match found for pattern: ${pattern}`);
                }
            } catch (e) {
                console.error('Invalid regex pattern:', e);
                throw new Error(`Invalid regex pattern: ${e.message}`);
            }
        }

        // Generate new filename by appending case number with spaces around it
        function generateNewFilename(caseNumber, originalName) {
            const separator = document.getElementById('separatorChar').value;
            const keepExt = document.getElementById('keepExtension').value;
            
            // Remove .pdf extension from original name
            let baseName = originalName.replace(/\.pdf$/i, '');
            
            // Keep original name as-is, just add space + case number + space before extension
            let newName = baseName + separator + caseNumber + separator;
            
            // Add extension if needed
            if (keepExt === 'yes') {
                newName += '.pdf';
            }
            
            return newName;
        }

        // Process all PDFs
        processBtn.addEventListener('click', async () => {
            processBtn.disabled = true;
            processBtn.innerHTML = '<span class="spinner"></span> Processing...';
            processedFiles = [];

            for (let i = 0; i < uploadedFiles.length; i++) {
                const file = uploadedFiles[i];
                const statusEl = document.getElementById(`status-${i}`);
                
                try {
                    statusEl.className = 'file-status processing';
                    statusEl.innerHTML = '<span class="spinner"></span> Processing...';
                    
                    const extractedText = await extractTextFromPDF(file);
                    const processedText = processExtractedText(extractedText);
                    const newFilename = generateNewFilename(processedText, file.name);
                    
                    processedFiles.push({
                        file: file,
                        newName: newFilename,
                        extractedText: processedText
                    });
                    
                    statusEl.className = 'file-status success';
                    statusEl.textContent = `✓ Renamed to: ${newFilename}`;
                } catch (error) {
                    console.error('Error processing file:', error);
                    statusEl.className = 'file-status error';
                    statusEl.textContent = `✗ Error: ${error.message}`;
                }
            }

            processBtn.disabled = false;
            processBtn.innerHTML = '<span>Process PDFs</span>';
            
            if (processedFiles.length > 0) {
                downloadBtnGroup.style.display = 'grid';
            }
        });

        // Download as ZIP and also extract files
        downloadZipBtn.addEventListener('click', async () => {
            downloadZipBtn.disabled = true;
            downloadZipBtn.innerHTML = '<span class="spinner"></span> Creating ZIP...';

            const zip = new JSZip();
            
            // Add all files to ZIP
            for (const item of processedFiles) {
                const arrayBuffer = await item.file.arrayBuffer();
                zip.file(item.newName, arrayBuffer);
            }

            // Generate the ZIP blob
            const blob = await zip.generateAsync({ type: 'blob' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `renamed_pdfs_${Date.now()}.zip`;
            a.click();
            URL.revokeObjectURL(url);

            downloadZipBtn.disabled = false;
            downloadZipBtn.innerHTML = '<span>Download ZIP</span>';
        });

        // Download individual files (simulates unzipping into folder)
        downloadIndividualBtn.addEventListener('click', async () => {
            downloadIndividualBtn.disabled = true;
            downloadIndividualBtn.innerHTML = '<span class="spinner"></span> Downloading Files...';

            // Download each file individually
            for (const item of processedFiles) {
                const arrayBuffer = await item.file.arrayBuffer();
                const blob = new Blob([arrayBuffer], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = item.newName;
                a.click();
                URL.revokeObjectURL(url);
                
                // Small delay between downloads to avoid browser blocking
                await new Promise(resolve => setTimeout(resolve, 100));
            }

            downloadIndividualBtn.disabled = false;
            downloadIndividualBtn.innerHTML = '<span>Download Individual Files</span>';
        });
    </script>
</body>
</html>
